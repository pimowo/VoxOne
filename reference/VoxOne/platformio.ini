[platformio]
default_envs = voxone

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.app_partition_name = app

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    knolleary/PubSubClient @ ^2.8
    git+https://github.com/pschatzmann/arduino-libhelix.git#5c0a04302dbd661a56408eeb1756e01dd8d33ba1

# Compile only the MP3 C decoder; omit AAC and the allocating C++ wrappers.
extra_scripts = pre:scripts/mp3_only.py

build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:voxone]
build_type = release

[env:voxone_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DVOXONE_DEBUG=1
