[platformio]
default_envs = l0

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = spiffs
board_build.partitions = partitions_yoradio.csv

extra_scripts =
    pre:scripts/build_web_assets.py
    pre:scripts/build_identity.py
    pre:scripts/patch_glcdfont.py
    post:scripts/versioned_artifacts.py

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/RTClib@2.1.4
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit SSD1305@2.2.3
    adafruit/Adafruit SH110X@2.1.15

[mcu_zero]
board = esp32-s3-devkitc-1
memory_type = qio_qspi
flash_mode = qio
psram_type = qio
flash_size = 4MB
maximum_size = 4194304

[mcu_devkit]
board = esp32-s3-devkitc-1
memory_type = qio_opi
flash_mode = qio
psram_type = opi
flash_size = 16MB
maximum_size = 16777216

[env:m0]
board = ${mcu_devkit.board}
board_build.arduino.memory_type = ${mcu_devkit.memory_type}
board_build.flash_mode = ${mcu_devkit.flash_mode}
board_build.psram_type = ${mcu_devkit.psram_type}
board_upload.flash_size = ${mcu_devkit.flash_size}
board_upload.maximum_size = ${mcu_devkit.maximum_size}
build_unflags = -O2 -fno-lto
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_M0=1
    -DVOXONE_PLAYER_SCROLL_CORE_ENABLED=1

[env:m0-heap-trace]
extends = env:m0
build_flags =
    ${env:m0.build_flags}
    -DVOXONE_HEAP_TRACE=1


[env:m0-security-test]
extends = env:m0
build_flags =
    ${env:m0.build_flags}
    -DVOXONE_BUILD_IS_PRODUCTION_FIRMWARE=0
    -DVOXONE_SECURITY_HTTP_ENFORCEMENT_TEST=1

[env:m0-ota-rollback-test]
extends = env:m0-security-test
build_flags =
    ${env:m0-security-test.build_flags}
    -DVOXONE_OTA_HIL_ROLLBACK_AFTER_PROBE=1

[env:s0]
board = ${mcu_zero.board}
board_build.arduino.memory_type = ${mcu_zero.memory_type}
board_build.flash_mode = ${mcu_zero.flash_mode}
board_build.psram_type = ${mcu_zero.psram_type}
board_upload.flash_size = ${mcu_zero.flash_size}
board_upload.maximum_size = ${mcu_zero.maximum_size}
build_unflags = -DARDUINO_RUNNING_CORE=1 -O2 -fno-lto
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVOXONE_PROFILE_S0=1

[env:s0-ota-rollback-test]
extends = env:s0
build_flags =
    ${env:s0.build_flags}
    -DVOXONE_OTA_HIL_ROLLBACK_AFTER_PROBE=1

[env:din0]
board = ${mcu_zero.board}
board_build.arduino.memory_type = ${mcu_zero.memory_type}
board_build.flash_mode = ${mcu_zero.flash_mode}
board_build.psram_type = ${mcu_zero.psram_type}
board_upload.flash_size = ${mcu_zero.flash_size}
board_upload.maximum_size = ${mcu_zero.maximum_size}
build_unflags = -O2 -fno-lto
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_DIN0=1

[env:l0]
board = ${mcu_devkit.board}
board_build.arduino.memory_type = ${mcu_devkit.memory_type}
board_build.flash_mode = ${mcu_devkit.flash_mode}
board_build.psram_type = ${mcu_devkit.psram_type}
board_upload.flash_size = ${mcu_devkit.flash_size}
board_upload.maximum_size = ${mcu_devkit.maximum_size}
build_unflags = -DARDUINO_RUNNING_CORE=1 -O2 -fno-lto
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVOXONE_PROFILE_L0=1
    -DVOXONE_PLAYER_SCROLL_CORE_ENABLED=1

[env:l0-ota-rollback-test]
extends = env:l0
build_flags =
    ${env:l0.build_flags}
    -DVOXONE_OTA_HIL_ROLLBACK_AFTER_PROBE=1

[env:l0-tx-only]
extends = env:l0
; DEV diagnostic image: UART0 keeps transmitting logs but SerialCli commands
; are discarded. This does not electrically isolate FT232R TX/DTR/RTS.
build_flags =
    ${env:l0.build_flags}
    -DVOXONE_SERIALCLI_RX_ENABLED=0
