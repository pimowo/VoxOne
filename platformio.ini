[platformio]
default_envs = x0

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = spiffs
board_build.partitions = partitions_yoradio.csv

extra_scripts =
    pre:scripts/build_web_assets.py
    pre:scripts/build_identity.py
    pre:scripts/patch_glcdfont.py
    post:scripts/versioned_artifacts.py

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/RTClib@2.1.4
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit SSD1305@2.2.3

[env:x0]
board = esp32dev
build_flags =
    -DVOXONE_PROFILE_X0=1

[env:b0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_B0=1

[env:c0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_C0=1

[env:c0_ssd1309]
extends = env:c0
build_flags =
    ${env:c0.build_flags}
    -DVOXONE_C0_DISPLAY_SSD1309=1

[env:a0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_A0=1

[env:a0_dsp]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_A0_DSP=1
