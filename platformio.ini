[platformio]
default_envs = w0

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = spiffs
board_build.partitions = partitions_yoradio.csv

extra_scripts =
    pre:scripts/build_web_assets.py
    pre:scripts/build_identity.py
    pre:scripts/recovery_ap_credential.py
    pre:scripts/patch_glcdfont.py
    post:scripts/versioned_artifacts.py

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/RTClib@2.1.4
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit SSD1305@2.2.3

[env:w0]
board = esp32dev
build_flags =
    -DVOXONE_PROFILE_W0=1

[env:m0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_M0=1
    -DVOXONE_PLAYER_SCROLL_CORE_ENABLED=1

[env:m0-security-test]
extends = env:m0
build_flags =
    ${env:m0.build_flags}
    -DVOXONE_SECURITY_HTTP_ENFORCEMENT_TEST=1

[env:m0-ota-rollback-test]
extends = env:m0-security-test
build_flags =
    ${env:m0-security-test.build_flags}
    -DVOXONE_OTA_HIL_ROLLBACK_AFTER_PROBE=1

[env:s0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_S0=1

[env:din0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_DIN0=1

[env:l0]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DVOXONE_PROFILE_L0=1
    -DVOXONE_PLAYER_SCROLL_CORE_ENABLED=1

[env:l0-tx-only]
extends = env:l0
; DEV diagnostic image: UART0 keeps transmitting logs but SerialCli commands
; are discarded. This does not electrically isolate FT232R TX/DTR/RTS.
build_flags =
    ${env:l0.build_flags}
    -DVOXONE_SERIALCLI_RX_ENABLED=0
